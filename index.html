<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dhaka Dash</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap">
<style>
:root{--bg:#2a1b3d;--ink:#fff0d2;--accent:#ff5a3c;--panel:rgba(32,20,48,.86);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1029;--panel:rgba(22,13,34,.88)}}
:root[data-theme="dark"]{--bg:#1a1029;--panel:rgba(22,13,34,.88)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%}
.f{font-family:"Rubik Mono One",Impact,"Arial Black",sans-serif}
#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;justify-content:space-between;padding:14px 18px;pointer-events:none;font-size:20px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#hud small{display:block;font-family:system-ui,sans-serif;font-size:12px;opacity:.8;margin-top:2px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
#card{background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:26px 28px;max-width:380px;text-align:center}
#card h1{margin:0 0 10px;font-size:34px;line-height:1.1;font-weight:400}
#card p{margin:0 0 18px;line-height:1.5;font-size:15px}
button{font:inherit;cursor:pointer}
#go{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 24px;font-size:16px}
#go:focus-visible,.pad:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#pads{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);display:none;justify-content:space-between;padding:18px}
.pad{width:42vw;max-width:200px;height:90px;border-radius:16px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);font-size:34px}
@media (pointer:coarse){#pads{display:flex}}
</style>
</head>
<body>
<div id="hud" class="f"><div><span id="sc">0</span> m<small>distance</small></div><div style="text-align:right"><span id="sp">0</span> km/h<small>speed</small></div></div>
<div id="pads"><button class="pad" id="bl" aria-label="Steer left">◀</button><button class="pad" id="br" aria-label="Steer right">▶</button></div>
<div id="ov"><div id="card"><h1 class="f" id="t">Dhaka Dash</h1><p id="m">Weave through traffic as the sun sets. Steer with the arrow keys or A and D. On a phone, hold the left or right button.</p><button id="go">Start driving</button></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf08a5d);
scene.fog=new THREE.Fog(0x8a4f72,40,200);
const cam=new THREE.PerspectiveCamera(65,1,.1,320);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
function rs(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
scene.add(new THREE.HemisphereLight(0xffd9a0,0x2a1a40,1));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(-5,10,5);scene.add(dl);
const box=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));
const glow=(w,h,d,c)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshBasicMaterial({color:c}));
// sun
const sun=new THREE.Mesh(new THREE.SphereGeometry(30,32,16),new THREE.MeshBasicMaterial({color:0xffe3a8,fog:false}));
sun.position.set(0,24,-280);scene.add(sun);
// ground and road
const grass=box(400,.1,640,0x3b2c58);grass.position.set(0,-.1,-250);scene.add(grass);
const road=box(13,.1,640,0x2b2b36);road.position.set(0,0,-250);scene.add(road);
[-6.3,6.3].forEach(x=>{const e=glow(.25,.12,640,0xfff0d2);e.position.set(x,.03,-250);scene.add(e)});
const dashes=new THREE.Group();
[-2.17,2.17].forEach(x=>{for(let i=0;i<32;i++){const d=glow(.22,.12,4,0xfff0d2);d.position.set(x,.03,-i*10);dashes.add(d)}});
scene.add(dashes);
// roadside buildings
const pal=[0x5b3f7a,0x7a4a6a,0x3d2c5e,0x8a5a78],bl=[];
for(let i=0;i<44;i++){const s=i%2?1:-1,w=6+Math.random()*5,h=6+Math.random()*26;
  const b=box(w,h,8+Math.random()*6,pal[i%4]);
  b.position.set(s*(7.5+w/2+Math.random()*3),h/2,-Math.floor(i/2)*16-Math.random()*6);scene.add(b);bl.push(b)}
// cars
function car(c){const g=new THREE.Group();
  const b=box(2,.7,4,c);b.position.y=.65;g.add(b);
  const t=box(1.6,.6,2,0x1c1c28);t.position.set(0,1.3,-.2);g.add(t);
  [[-1.05,1.3],[1.05,1.3],[-1.05,-1.3],[1.05,-1.3]].forEach(([x,z])=>{const w=box(.35,.7,.8,0x111);w.position.set(x,.35,z);g.add(w)});
  [-.65,.65].forEach(x=>{const l=glow(.5,.2,.1,0xff2a2a);l.position.set(x,.75,2.02);g.add(l)});
  return g}
const player=car(0xff5a3c);scene.add(player);
const cols=[0x3fa7d6,0xf2c14e,0x59c3a5,0xe8e8f0,0x9b6ee0,0xd1495b];
const LANES=[-4.3,0,4.3],traffic=[];
function respawn(c,z){c.position.set(LANES[Math.random()*3|0],0,z);c.userData.s=12+Math.random()*10;
  c.children[0].material.color.setHex(cols[Math.random()*cols.length|0])}
for(let i=0;i<7;i++){const c=car(cols[i%6]);respawn(c,-70-i*38);scene.add(c);traffic.push(c)}
// state
let state='ready',v=22,dist=0,px=0,steer=0,shake=0,off=0,best=0;
try{best=+localStorage.getItem('dd-best')||0}catch(e){}
const keys={l:0,r:0},$=id=>document.getElementById(id);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.l=1;if(k==='arrowright'||k==='d')keys.r=1;
  if((k===' '||k==='enter')&&state!=='run'){e.preventDefault();start()}});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')keys.l=0;if(k==='arrowright'||k==='d')keys.r=0});
[['bl','l'],['br','r']].forEach(([id,k])=>{const el=$(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>keys[k]=0))});
function start(){state='run';v=30;dist=0;px=0;steer=0;shake=0;player.rotation.set(0,0,0);
  traffic.forEach((c,i)=>respawn(c,-70-i*38));$('ov').style.display='none'}
$('go').addEventListener('click',start);
function crash(){state='over';shake=.7;const d=Math.floor(dist);
  if(d>best){best=d;try{localStorage.setItem('dd-best',d)}catch(e){}}
  $('t').textContent='Crashed';
  $('m').textContent='Distance: '+d+' m. Best: '+best+' m.';
  $('go').textContent='Drive again';$('ov').style.display='flex'}
const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  if(state==='run'){
    v=Math.min(95,v+1.5*dt);dist+=v*dt;
    steer+=((keys.r-keys.l)-steer)*Math.min(1,dt*8);
    px=Math.max(-5.3,Math.min(5.3,px+steer*dt*(10+v*.1)));
  }else if(state==='over'){v=Math.max(0,v-70*dt);player.rotation.y+=v>1?7*dt:0}
  else v=22;
  player.position.x=px;
  if(state==='run'){player.rotation.y=-steer*.25;player.rotation.z=-steer*.06}
  off=(off+v*dt)%10;dashes.position.z=off;
  bl.forEach(b=>{b.position.z+=v*dt;if(b.position.z>24)b.position.z-=352});
  traffic.forEach(c=>{c.position.z+=(v-c.userData.s)*dt;
    if(c.position.z>16)respawn(c,-230-Math.random()*60);
    if(state==='run'&&Math.abs(c.position.x-px)<1.9&&Math.abs(c.position.z)<3.8)crash()});
  shake*=Math.pow(.02,dt);
  cam.fov=65+(v-30)*.15;cam.updateProjectionMatrix();
  cam.position.set(px*.5+(Math.random()-.5)*shake,4.2+(Math.random()-.5)*shake,9);
  cam.lookAt(px*.4,1,-12);
  $('sc').textContent=Math.floor(dist);$('sp').textContent=Math.round(v*3);
  ren.render(scene,cam)}
tick();
</script>
</body>
</html>
